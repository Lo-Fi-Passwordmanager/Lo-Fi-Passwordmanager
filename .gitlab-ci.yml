image: node:24.12.0

before_script:
  - yarn install

stages:
  - test
  - build

tests:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH != 'main'
    - if: $CI_COMMIT_BRANCH == 'main'
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  script:
    - yarn test:ci

playwright:
  stage: test
  variables:
    DEPLOYMENT_URL: "https://5bcaaf94-60ef-4757-b55c-5f2e443c480c.ka.bw-cloud-instance.org/test"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH != 'main'
    - if: $CI_COMMIT_BRANCH == 'main'
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  script:
    - yarn install
    - yarn build:test
    - chmod og= $ID_ED25519
    - ssh -i $ID_ED25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP 'cd /home/ubuntu/automerge/test/ && rm -rf *'
    - scp -i $ID_ED25519 -o StrictHostKeyChecking=no -r ./dist/** $SERVER_USER@$SERVER_IP:/home/ubuntu/automerge/test/
    - yarn playwright test

test-build:
  dependencies:
    - tests
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH != 'main'
  script:
    - yarn install
    - yarn build
  artifacts:
    when: always
    name: "Offline Build"
    paths:
      - ./dist

build:
  stage: build
  dependencies:
    - tests
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == 'main'
  script:
    - yarn install
    - yarn build:deploy
    - chmod og= $ID_ED25519
    - ssh -i $ID_ED25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP 'cd /home/ubuntu/automerge/dist/ && rm -rf *'
    - scp -i $ID_ED25519 -o StrictHostKeyChecking=no -r ./dist/** $SERVER_USER@$SERVER_IP:/home/ubuntu/automerge/dist/
  artifacts:
    when: always
    name: "Build"
    paths:
      - ./dist