image: node:24.12.0

before_script:
  - yarn install

stages:
  - lint
  - test-report
  - test
  - build

lint:
  stage: lint
  script:
    - yarn eslint

tests:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH != 'main'
    - if: $CI_COMMIT_BRANCH == 'main'
  script:
    - yarn test:ci

playwright:
  stage: test
  tags:
    - "kgr1-instance-experimental"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH != 'main'
    - if: $CI_COMMIT_BRANCH == 'main'
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  script:
    - yarn install
    - yarn playwright test

# Uploads the test report to the server
test-report:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH != 'main'
    - if: $CI_COMMIT_BRANCH == 'main'
  script:
    - yarn test:ci || true
    - chmod og= $ID_ED25519
    - ssh -i $ID_ED25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP 'cd /home/ubuntu/automerge/reports/coverage/ && rm -rf *'
    - scp -i $ID_ED25519 -o StrictHostKeyChecking=no -r ./coverage/** $SERVER_USER@$SERVER_IP:/home/ubuntu/automerge/reports/coverage/
    - ssh -i $ID_ED25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP 'cd /home/ubuntu/automerge/reports/coverage/ && sed -i "s/src=\"/src=\"coverage\//g" index.html && sed -i "s/href=\"/href=\"coverage\//g" index.html && sed -i "s/href=\"coverage\/https:\/\//href=\"https:\/\//g" index.html'


playwright-coverage:
  stage: test
  tags:
    - "kgr1-instance-experimental"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH != 'main'
    - if: $CI_COMMIT_BRANCH == 'main'
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  allow_failure: true
  script:
    - yarn install
    - chmod og= $ID_ED25519
    - yarn e2e:coverage || true
    - yarn e2e:report || true
    - ssh -i $ID_ED25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP 'cd /home/ubuntu/automerge/reports/playwright-coverage/ && rm -rf *'
    - scp -i $ID_ED25519 -o StrictHostKeyChecking=no -r ./coverage/** $SERVER_USER@$SERVER_IP:/home/ubuntu/automerge/reports/playwright-coverage/
    - ssh -i $ID_ED25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP 'cd /home/ubuntu/automerge/reports/playwright-coverage/ && sed -i "s/src=\"/src=\"ecov\//g" index.html && sed -i "s/href=\"/href=\"ecov\//g" index.html && sed -i "s/href=\"ecov\/https:\/\//href=\"https:\/\//g" index.html'

playwright-report:
  stage: test
  tags:
    - "kgr1-instance-experimental"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH != 'main'
    - if: $CI_COMMIT_BRANCH == 'main'
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  allow_failure: true
  script:
    - yarn install
    - chmod og= $ID_ED25519
    - yarn playwright test --trace on || true
    - ssh -i $ID_ED25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP 'cd /home/ubuntu/automerge/reports/playwright/ && rm -rf *'
    - scp -i $ID_ED25519 -o StrictHostKeyChecking=no -r ./playwright-report/** $SERVER_USER@$SERVER_IP:/home/ubuntu/automerge/reports/playwright/

test-build:
  dependencies:
    - tests
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH != 'main'
  script:
    - yarn install
    - yarn build
  artifacts:
    when: always
    name: "Offline Build"
    paths:
      - ./dist

build:
  stage: build
  dependencies:
    - tests
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == 'main'
  script:
    - yarn install
    - yarn build:deploy
    - chmod og= $ID_ED25519
    - ssh -i $ID_ED25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP 'cd /home/ubuntu/automerge/dist/ && rm -rf *'
    - scp -i $ID_ED25519 -o StrictHostKeyChecking=no -r ./dist/** $SERVER_USER@$SERVER_IP:/home/ubuntu/automerge/dist/
  artifacts:
    when: always
    name: "Build"
    paths:
      - ./dist