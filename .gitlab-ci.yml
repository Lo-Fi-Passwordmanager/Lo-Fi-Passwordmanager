image: node:24.12.0

before_script:
  - yarn install

stages:
  - test
  - build

test:
  stage: test
  script:
    - yarn test:ci
  artifacts:
    when: always
    name: "Test Results"
    paths:
      - ./test-output

test-build:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH != 'main'
  script:
    - yarn install
    - yarn build
  artifacts:
    when: always
    name: "Build"
    paths:
      - ./dist

build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == 'main'
  script:
    - yarn install
    - yarn build:deploy
    - chmod og= $ID_ED25519
    - ssh -i $ID_ED25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP 'cd /home/ubuntu/automerge/dist/ && rm -rf *'
    - scp -i $ID_ED25519 -o StrictHostKeyChecking=no -r ./dist/** $SERVER_USER@$SERVER_IP:/home/ubuntu/automerge/dist/
  artifacts:
    when: always
    name: "Build"
    paths:
      - ./dist