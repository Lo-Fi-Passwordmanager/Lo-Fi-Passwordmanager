image: node:24.12.0

before_script:
  - yarn install

stages:
  - test
  - build

tests:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH != 'main'
    - if: $CI_COMMIT_BRANCH == 'main'
  script:
    - yarn test:ci

# Uploads the test report to the server
test-report:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH != 'main'
    - if: $CI_COMMIT_BRANCH == 'main'
  script:
    - yarn test:ci || true
    - chmod og= $ID_ED25519
    - ssh -i $ID_ED25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP 'cd /home/ubuntu/automerge/reports/coverage/ && rm -rf *'
    - scp -i $ID_ED25519 -o StrictHostKeyChecking=no -r ./coverage/** $SERVER_USER@$SERVER_IP:/home/ubuntu/automerge/reports/coverage/
    - ssh -i $ID_ED25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP 'cd /home/ubuntu/automerge/reports/coverage/ && sed -i "s/href=\"/href=\"coverage\//g" index.html && sed -i "s/href=\"coverage\/https:\/\//href=\"https:\/\//g" index.html'


test-build:
  dependencies:
    - tests
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH != 'main'
  script:
    - yarn install
    - yarn build
  artifacts:
    when: always
    name: "Offline Build"
    paths:
      - ./dist

build:
  stage: build
  dependencies:
    - tests
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == 'main'
  script:
    - yarn install
    - yarn build:deploy
    - chmod og= $ID_ED25519
    - ssh -i $ID_ED25519 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP 'cd /home/ubuntu/automerge/dist/ && rm -rf *'
    - scp -i $ID_ED25519 -o StrictHostKeyChecking=no -r ./dist/** $SERVER_USER@$SERVER_IP:/home/ubuntu/automerge/dist/
  artifacts:
    when: always
    name: "Build"
    paths:
      - ./dist